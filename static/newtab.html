<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>New Tab</title>
  <script type="module" src="newtab.js"></script>
</head>
<body>
  <div class="clock" hidden><time></time><small></small></div>
  <main class="panel"></main>
  <button class="stale" type="button" hidden></button>
  <dialog class="stale-dialog" aria-labelledby="stale-title">
    <form method="dialog">
      <h2 id="stale-title">Tabs untouched for a week</h2>
      <ul class="stale-list"></ul>
      <footer>
        <button value="cancel" type="submit">Cancel</button>
        <button class="primary" value="close" type="submit"></button>
      </footer>
    </form>
  </dialog>
  <div class="toast" role="status" hidden><span></span><button type="button">Undo</button></div>
</body>
</html>
